<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- Títulos de seções  -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <!-- Todo o portifólio -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <title>Portifólio - Katheriny Kamili</title>
</head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="container"></div>
        <nav>

            <a class="logo" href="#inicio">
                <span class="logo-letra">K</span>
                <span class="logo-nome">Katheriny Kamili</span>
            </a>

            <a href="index.html">Início</a>
            <a href="#sobre">Sobre</a>
            <a href="#habilidades">Habilidades</a>
            <a href="#projetos">Projetos</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>
    <br>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
  
        <section class="contato">
            <h2>Entre em Contato</h2>

            <form action="obrigada.html" method="get">
                <div>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required minlength="3">
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Seu email" required>
                </div>
                <div>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 1234-5678" required minlength="3">
                </div>
                <div>
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Sua mensagem" required minlength="3"></textarea>
                </div>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
    <br>

    <!-- RODAPÉ -->
    <footer>
        <p>&copy; 2026 Katheriny Kamili - Desenvolvedora Web Front-end</p>
    </footer>

</body>

</html>
