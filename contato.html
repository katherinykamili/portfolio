<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Katheriny Kamili | Portfólio</title>
</head>

<body>
    <!-- CABEÇALHO -->
    <header>
        <div class="logo">
        <h1>Katheriny Kamili</h1>
        <p><b>Portfólio - Desenvolvedora Web Front-end</b></p>
    </div>
    </header>
    <br>
    <!-- NAVEGAÇÃO -->
    <nav>
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre</a>
        <a href="projetos.html">Projetos</a>
        <a href="contato.html">Contato</a>
    </nav>
    <br>


        <!-- CONTEÚDO PRINCIPAL -->
    <main>
  
        <section class="contato">
            <h2>Entre em Contato</h2>

            <form action="obrigada.html" method="get">
                <div>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required minlength="3">
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Seu email" required>
                </div>
                <div>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 1234-5678" required minlength="3">
                </div>
                <div>
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Sua mensagem" required minlength="3"></textarea>
                </div>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
    <br>

    <!-- RODAPÉ -->
    <footer>
        <p>&copy; 2026 Katheriny Kamili - Desenvolvedora Web Front-end</p>
    </footer>

</body>

</html>
